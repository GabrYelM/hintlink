version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hintlink_postgres
    restart: always
    environment:
      POSTGRES_USER: hintlink_user
      POSTGRES_PASSWORD: hintlink_password
      POSTGRES_DB: hintlink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hintlink_user -d hintlink_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:7.2-alpine
    container_name: hintlink_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
